<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel's Brain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes flash {
            0%   { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff4400; opacity: 1; }
            4%   { color: #cc0000; text-shadow: none; opacity: 0.6; }
            6%   { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000; opacity: 1; }
            8%   { color: #cc0000; text-shadow: none; opacity: 0.5; }
            10%  { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff4400; opacity: 1; }
            60%  { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff4400; opacity: 1; }
            62%  { color: #cc0000; text-shadow: none; opacity: 0.55; }
            64%  { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000; opacity: 1; }
            100% { color: #ff0000; text-shadow: 0 0 8px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff4400; opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; min-height: 100vh; }

        .page { display: none; }
        .page.active { display: block; }

        /* ─── HOME ─── */
        #homePage { display: none; justify-content: center; align-items: center; min-height: 100vh; height: 100vh; padding: 0 20px; text-align: center; flex-direction: column; overflow: hidden; }
        #homePage.active { display: flex; }

        .home-title { font-family: 'Courier New', monospace; font-weight: bold; letter-spacing: 4px; animation: flash 5s infinite; margin: 0; line-height: 1; }
        .menu { display: flex; flex-direction: column; gap: 0; align-items: center; margin: 0; }
        .menu-item { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: 3px; color: #ffffff; cursor: pointer; transition: opacity 0.3s; line-height: 1; background: none; border: none; margin: 0; padding: 0; display: block; }
        .menu-item:hover { opacity: 0.7; }

        .pencil-btn { position: fixed; top: 20px; right: 20px; cursor: pointer; transition: opacity 0.3s; background: none; border: none; z-index: 10; }
        .pencil-btn:hover { opacity: 0.7; }

        /* ─── CATEGORY PAGE ─── */
        #categoryPage.active { display: flex; min-height: 100vh; }

        .sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px; }
        .sidebar-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 5rem; font-weight: 900; letter-spacing: 3px; color: #ffffff; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); line-height: 1.1; }
        .cat-main { margin-left: 200px; width: calc(100% - 200px); padding: 40px; }
        .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; max-width: 1200px; }
        .cat-logo { font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; animation: flash 5s infinite; cursor: pointer; background: none; border: none; color: #ff0000; }
        .home-btn { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 1rem; font-weight: 700; color: #ffffff; cursor: pointer; padding: 10px 20px; border: 2px solid #ffffff; background: transparent; transition: opacity 0.3s; }
        .home-btn:hover { opacity: 0.7; }

        .add-review-section { display: none; margin-bottom: 60px; padding: 30px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; }
        .add-review-section.show { display: block; animation: fadeIn 0.3s ease; }
        .add-review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-review-title { font-size: 1.5rem; font-weight: bold; }
        .current-user { color: #00ff00; margin-bottom: 15px; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 1rem; font-weight: bold; margin-bottom: 10px; }
        .form-group input, .form-group textarea { padding: 12px; background-color: #1a1a1a; border: 1px solid #444; color: #ffffff; font-family: Arial, sans-serif; font-size: 1rem; border-radius: 4px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .image-preview { max-width: 200px; margin-top: 10px; border: 1px solid #444; display: none; }
        .form-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .submit-btn { flex: 1; padding: 12px; background-color: #ff0000; color: #ffffff; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; transition: opacity 0.3s; }
        .submit-btn:hover { opacity: 0.8; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .cancel-btn { flex: 1; padding: 12px; background-color: #444; color: #ffffff; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; transition: opacity 0.3s; }
        .cancel-btn:hover { opacity: 0.8; }

        .logout-btn { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.9rem; font-weight: 700; color: #ffffff; cursor: pointer; padding: 8px 15px; border: 1px solid #ffffff; background: transparent; transition: opacity 0.3s; }
        .logout-btn:hover { opacity: 0.7; }

        .reviews-content { max-width: 1200px; }
        .review { margin-bottom: 50px; padding-bottom: 40px; border-bottom: 1px solid #444; animation: fadeIn 0.3s ease; }
        .review:last-child { border-bottom: none; }
        .review-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
        .review-meta { color: #999; font-size: 0.9rem; margin-bottom: 15px; }
        .review-image { max-width: 300px; height: auto; margin: 20px 0; border: 1px solid #444; }
        .review-text { margin-top: 15px; line-height: 1.8; }
        .delete-btn { background-color: #ff0000; color: #ffffff; border: none; padding: 8px 15px; margin-top: 15px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; display: inline-block; }
        .delete-btn:hover { opacity: 0.7; }
        .no-reviews { text-align: center; color: #999; font-size: 1.2rem; margin: 60px 0; }
        .loading { text-align: center; color: #999; font-size: 1rem; }

        /* ─── WRITE PAGE ─── */
        #loginScreen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box { width: 100%; max-width: 420px; animation: fadeIn 0.4s ease; }
        .login-logo { font-family: 'Courier New', monospace; font-size: 2rem; font-weight: bold; letter-spacing: 3px; animation: flash 5s infinite; margin-bottom: 10px; display: block; cursor: pointer; background: none; border: none; color: #ff0000; text-align: left; }
        .login-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; color: #666; text-transform: uppercase; margin-bottom: 50px; }
        .login-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; color: #888; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .login-input { width: 100%; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid #333; color: #ffffff; font-family: 'Courier New', monospace; font-size: 1rem; outline: none; transition: border-color 0.3s; margin-bottom: 30px; }
        .login-input:focus { border-bottom-color: #ffffff; }
        .login-input::placeholder { color: #444; }
        .login-submit-btn { width: 100%; padding: 16px; background-color: #ffffff; color: #1a1a1a; border: none; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.8rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; transition: opacity 0.2s; margin-top: 10px; }
        .login-submit-btn:hover { opacity: 0.85; }
        .login-error { color: #ff0000; font-size: 0.8rem; text-align: center; margin-top: 15px; min-height: 20px; font-family: 'Courier New', monospace; letter-spacing: 1px; }
        .back-link-btn { display: block; text-align: center; margin-top: 40px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.7rem; letter-spacing: 3px; color: #555; text-transform: uppercase; transition: color 0.2s; background: none; border: none; cursor: pointer; width: 100%; }
        .back-link-btn:hover { color: #ffffff; }

        #writeScreen { display: none; min-height: 100vh; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; border-bottom: 1px solid #2a2a2a; }
        .top-logo { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; animation: flash 5s infinite; cursor: pointer; background: none; border: none; color: #ff0000; }
        .top-right { display: flex; align-items: center; gap: 20px; }
        .user-badge { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #555; letter-spacing: 1px; }
        .write-logout-btn { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 3px; color: #555; background: none; border: 1px solid #333; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .write-logout-btn:hover { border-color: #ffffff; color: #ffffff; }
        .write-container { max-width: 700px; margin: 0 auto; padding: 60px 40px 80px; animation: fadeIn 0.4s ease; }
        .write-heading { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; color: #ffffff; margin-bottom: 8px; line-height: 1; }
        .write-sub { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #555; letter-spacing: 2px; margin-bottom: 50px; }
        .field-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 3px; color: #666; text-transform: uppercase; display: block; margin-bottom: 10px; }
        .category-select { width: 100%; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid #333; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; transition: border-color 0.3s; }
        .category-select:focus { border-bottom-color: #ffffff; }
        .category-select option { background-color: #1a1a1a; color: #ffffff; font-size: 1rem; }
        .select-wrapper { position: relative; margin-bottom: 40px; }
        .select-wrapper::after { content: '▼'; position: absolute; right: 0; bottom: 16px; font-size: 0.7rem; color: #555; pointer-events: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .write-form-field { margin-bottom: 30px; }
        .field-input { width: 100%; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid #333; color: #ffffff; font-family: 'Courier New', monospace; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .field-input:focus { border-bottom-color: #ffffff; }
        .field-input::placeholder { color: #444; }
        .field-textarea { width: 100%; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid #333; color: #ffffff; font-family: 'Courier New', monospace; font-size: 0.95rem; outline: none; resize: none; min-height: 180px; line-height: 1.7; transition: border-color 0.3s; }
        .field-textarea:focus { border-bottom-color: #ffffff; }
        .field-textarea::placeholder { color: #444; }
        .write-image-preview { max-width: 200px; max-height: 200px; margin-top: 12px; display: none; border: 1px solid #333; }
        .submit-row { display: flex; gap: 15px; margin-top: 50px; }
        .write-submit-btn { flex: 1; padding: 18px; background-color: #ffffff; color: #1a1a1a; border: none; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.8rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; transition: opacity 0.2s; }
        .write-submit-btn:hover { opacity: 0.85; }
        .write-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .write-clear-btn { padding: 18px 30px; background-color: transparent; color: #555; border: 1px solid #333; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; transition: all 0.2s; }
        .write-clear-btn:hover { border-color: #ffffff; color: #ffffff; }
        .success-banner { display: none; background-color: #ffffff; color: #1a1a1a; padding: 20px 40px; text-align: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.8rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-top: 30px; animation: fadeIn 0.3s ease; }
        .success-banner.show { display: block; }
        .section-divider { border: none; border-top: 1px solid #2a2a2a; margin: 40px 0; }
        #reviewFieldsBlock { display: none; }

        /* ─── MANAGE REVIEWS (write page) ─── */
        .manage-reviews-section { margin-top: 60px; }
        .manage-reviews-heading { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 2px; color: #ffffff; margin-bottom: 8px; }
        .manage-reviews-sub { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #555; letter-spacing: 2px; margin-bottom: 30px; }
        .manage-review-item { border-bottom: 1px solid #2a2a2a; padding: 20px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; animation: fadeIn 0.3s ease; }
        .manage-review-item:last-child { border-bottom: none; }
        .manage-review-info { flex: 1; }
        .manage-review-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 1rem; font-weight: 900; letter-spacing: 1px; color: #ffffff; margin-bottom: 4px; }
        .manage-review-meta { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #555; letter-spacing: 1px; }
        .manage-delete-btn { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 3px; color: #ff0000; background: none; border: 1px solid #ff0000; padding: 7px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
        .manage-delete-btn:hover { background-color: #ff0000; color: #ffffff; }
        .manage-no-reviews { font-family: 'Courier New', monospace; font-size: 0.85rem; color: #444; letter-spacing: 1px; padding: 20px 0; }
        .manage-category-filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .filter-btn { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; color: #555; background: none; border: 1px solid #333; padding: 6px 12px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { border-color: #ffffff; color: #ffffff; }

        /* ─── MODAL ─── */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background-color: #2a2a2a; padding: 40px; border-radius: 8px; border: 1px solid #444; width: 90%; max-width: 500px; }
        .modal-title { font-size: 2rem; font-weight: bold; margin-bottom: 30px; text-align: center; }
        .modal-form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .modal-form-group label { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #ffffff; }
        .modal-form-group input { padding: 12px; background-color: #1a1a1a; border: 1px solid #444; color: #ffffff; font-family: Arial, sans-serif; font-size: 1rem; border-radius: 4px; }
        .modal-form-group input:focus { outline: none; border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        .modal-buttons { display: flex; gap: 15px; margin-top: 30px; }
        .modal-buttons button { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; transition: opacity 0.3s; }
        .modal-login-btn { background-color: #ff0000; color: #ffffff; }
        .modal-login-btn:hover { opacity: 0.8; }
        .modal-cancel-btn { background-color: #444; color: #ffffff; }
        .modal-cancel-btn:hover { opacity: 0.8; }
        .error-message { color: #ff0000; font-size: 0.9rem; margin-top: 10px; text-align: center; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            #categoryPage.active { flex-direction: column; }
            .sidebar { position: relative; width: 100%; height: auto; padding: 20px; justify-content: flex-start; }
            .sidebar-title { font-size: 3rem; writing-mode: horizontal-tb; transform: none; margin-bottom: 20px; }
            .cat-main { margin-left: 0; width: 100%; padding: 20px; }
            .cat-header { flex-direction: column; gap: 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ══════════ HOME PAGE ══════════ -->
<div id="homePage" class="active">
    <button class="pencil-btn" onclick="goWrite()" title="Write a review">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
    </button>
    <h1 class="home-title">&gt; angel's_brain</h1>
    <nav class="menu">
        <button class="menu-item" onclick="goCategory('music')">MUSIC<span>,</span></button>
        <button class="menu-item" onclick="goCategory('movies')">MOVIES<span>,</span></button>
        <button class="menu-item" onclick="goCategory('wrestling')">PRO-WRESTLING<span>,</span></button>
        <button class="menu-item" onclick="goCategory('fashion')">FASHION<span>,</span></button>
        <button class="menu-item" onclick="goCategory('tech')">TECH</button>
    </nav>
</div>

<!-- ══════════ CATEGORY PAGE ══════════ -->
<div id="categoryPage" class="page">
    <div class="sidebar">
        <div class="sidebar-title" id="sidebarTitle">MUSIC</div>
    </div>
    <div class="cat-main">
        <div class="cat-header">
            <button class="cat-logo" onclick="goHome()">&gt; angel's_brain</button>
            <button class="home-btn" onclick="goHome()">HOME</button>
        </div>

        <div class="modal" id="catLoginModal">
            <div class="modal-content">
                <div class="modal-title">Admin Login</div>
                <div class="modal-form-group">
                    <label>Password</label>
                    <input type="password" id="catPassword" placeholder="Enter password">
                </div>
                <div class="error-message" id="catLoginError"></div>
                <div class="modal-buttons">
                    <button class="modal-login-btn" onclick="doCatLogin()">LOGIN</button>
                    <button class="modal-cancel-btn" onclick="closeCatModal()">CANCEL</button>
                </div>
            </div>
        </div>

        <div class="add-review-section" id="addReviewSection">
            <div class="current-user" id="currentUserDisplay"></div>
            <div class="add-review-header">
                <div class="add-review-title">Add New Review</div>
                <button class="logout-btn" onclick="doCatLogout()">LOGOUT</button>
            </div>
            <div class="form-group">
                <label id="catTitleLabel">Title *</label>
                <input type="text" id="catTitle" placeholder="">
            </div>
            <div class="form-group">
                <label id="catArtistLabel">Artist *</label>
                <input type="text" id="catArtist" placeholder="">
            </div>
            <div class="form-group">
                <label>Date *</label>
                <input type="date" id="catDate">
            </div>
            <div class="form-group">
                <label>Image URL (Optional)</label>
                <input type="url" id="catImage" placeholder="https://...">
                <img id="catImagePreview" class="image-preview" alt="preview">
            </div>
            <div class="form-group">
                <label id="catTextLabel">Your Review *</label>
                <textarea id="catText" placeholder="Write your review here..."></textarea>
            </div>
            <div class="form-buttons">
                <button class="submit-btn" id="catSubmitBtn" onclick="submitCatReview()">POST REVIEW</button>
                <button class="cancel-btn" onclick="clearCatForm()">CLEAR</button>
            </div>
        </div>

        <div class="reviews-content" id="reviewsContainer">
            <div class="loading">Loading reviews...</div>
        </div>
    </div>
</div>

<!-- ══════════ WRITE PAGE ══════════ -->
<div id="writePage" class="page">
    <div id="loginScreen">
        <div class="login-box">
            <button class="login-logo" onclick="goHome()">&gt; angel's_brain</button>
            <div class="login-sub">Review Portal</div>
            <label class="login-label">Password</label>
            <input type="password" class="login-input" id="loginPassword" placeholder="••••••••">
            <button class="login-submit-btn" onclick="attemptLogin()">Enter</button>
            <div class="login-error" id="loginError"></div>
            <button class="back-link-btn" onclick="goHome()">&#8592; back to home</button>
        </div>
    </div>

    <div id="writeScreen">
        <div class="top-bar">
            <button class="top-logo" onclick="goHome()">&gt; angel's_brain</button>
            <div class="top-right">
                <span class="user-badge">// angel</span>
                <button class="write-logout-btn" onclick="doWriteLogout()">Logout</button>
            </div>
        </div>
        <div class="write-container">
            <div class="write-heading">WRITE.</div>
            <div class="write-sub">// new review</div>
            <label class="field-label">Category</label>
            <div class="select-wrapper">
                <select class="category-select" id="writeCategorySelect" onchange="onWriteCategoryChange()">
                    <option value="">&#8212; select a page &#8212;</option>
                    <option value="music">MUSIC</option>
                    <option value="movies">MOVIES</option>
                    <option value="wrestling">PRO-WRESTLING</option>
                    <option value="fashion">FASHION</option>
                    <option value="tech">TECH</option>
                </select>
            </div>
            <hr class="section-divider">
            <div id="reviewFieldsBlock">
                <div class="form-row">
                    <div class="write-form-field">
                        <label class="field-label" id="wTitleLabel">Title</label>
                        <input type="text" class="field-input" id="wTitle" placeholder="">
                    </div>
                    <div class="write-form-field">
                        <label class="field-label" id="wArtistLabel">Artist / Creator</label>
                        <input type="text" class="field-input" id="wArtist" placeholder="">
                    </div>
                </div>
                <div class="write-form-field">
                    <label class="field-label">Date</label>
                    <input type="date" class="field-input" id="wDate">
                </div>
                <div class="write-form-field">
                    <label class="field-label">Image URL <span style="color:#444;">(optional)</span></label>
                    <input type="url" class="field-input" id="wImage" placeholder="https://...">
                    <img id="wImagePreview" class="write-image-preview" alt="preview">
                </div>
                <div class="write-form-field">
                    <label class="field-label">Your Review</label>
                    <textarea class="field-textarea" id="wText" placeholder="Write your thoughts here..."></textarea>
                </div>
                <div class="submit-row">
                    <button class="write-submit-btn" id="wSubmitBtn" onclick="submitWriteReview()">Post Review</button>
                    <button class="write-clear-btn" onclick="clearWriteForm()">Clear</button>
                </div>
                <div class="success-banner" id="successBanner">&#10003; Review posted successfully!</div>
            </div>

            <!-- Manage existing reviews -->
            <div class="manage-reviews-section" id="manageReviewsSection">
                <hr class="section-divider">
                <div class="manage-reviews-heading">MANAGE.</div>
                <div class="manage-reviews-sub">// existing reviews</div>
                <div class="manage-category-filter" id="manageCategoryFilter">
                    <button class="filter-btn active" onclick="filterManageReviews('all', this)">ALL</button>
                    <button class="filter-btn" onclick="filterManageReviews('music', this)">MUSIC</button>
                    <button class="filter-btn" onclick="filterManageReviews('movies', this)">MOVIES</button>
                    <button class="filter-btn" onclick="filterManageReviews('wrestling', this)">PRO-WRESTLING</button>
                    <button class="filter-btn" onclick="filterManageReviews('fashion', this)">FASHION</button>
                    <button class="filter-btn" onclick="filterManageReviews('tech', this)">TECH</button>
                </div>
                <div id="manageReviewsList"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ─── STORAGE ───
// Remove old placeholder seed reviews (ids 1,2,3) if they exist
(function removeSeedReviews() {
    const reviews = JSON.parse(localStorage.getItem('angelReviews') || '[]');
    const filtered = reviews.filter(r => r.id !== 1 && r.id !== 2 && r.id !== 3);
    if (filtered.length !== reviews.length) localStorage.setItem('angelReviews', JSON.stringify(filtered));
})();
function getReviews() {
    try { return JSON.parse(localStorage.getItem('angelReviews') || '[]'); } catch(e) { return []; }
}
function saveReviews(r) { localStorage.setItem('angelReviews', JSON.stringify(r)); }


// ─── ROUTING ───
let currentCategory = '';
let catLoggedIn = false;

function showPage(id) {
    document.querySelectorAll('.page, #homePage').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}

function goHome() { showPage('homePage'); }

function goCategory(cat) {
    currentCategory = cat;
    const labels = { music: 'MUSIC', movies: 'MOVIES', wrestling: 'PRO-WRESTLING', fashion: 'FASHION', tech: 'TECH' };
    document.getElementById('sidebarTitle').textContent = labels[cat] || cat.toUpperCase();
    document.getElementById('addReviewSection').classList.remove('show');
    loadCategoryReviews();
    showPage('categoryPage');
}

function goWrite() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('writeScreen').style.display = 'block';
    loadManageReviews('all');
    showPage('writePage');
}

// ─── CATEGORY PAGE ───
const catConfig = {
    music:     { titleLabel: 'Album / Song Title', titlePh: 'e.g., Midnights',          artistLabel: 'Artist',                   artistPh: 'e.g., Taylor Swift',      textPh: 'What did this album/song make you feel?' },
    movies:    { titleLabel: 'Movie Title',         titlePh: 'e.g., Oppenheimer',         artistLabel: 'Director',                 artistPh: 'e.g., Christopher Nolan', textPh: 'Was it worth watching? Talk about the story, acting...' },
    wrestling: { titleLabel: 'Event / Match Name',  titlePh: 'e.g., WrestleMania 39',    artistLabel: 'Organization / Promotion', artistPh: 'e.g., WWE',               textPh: 'Break down the card, the crowd, the highlights...' },
    fashion:   { titleLabel: 'Brand / Item Name',   titlePh: 'e.g., Oversized Blazer',   artistLabel: 'Designer / Store',         artistPh: 'e.g., ZARA',              textPh: "How does it fit? What's the quality like?" },
    tech:      { titleLabel: 'Product / Device',    titlePh: 'e.g., iPhone 15 Pro',      artistLabel: 'Brand',                    artistPh: 'e.g., Apple',             textPh: 'Performance, design, value for money...' },
};

function setCatFormLabels(cat) {
    const c = catConfig[cat]; if (!c) return;
    document.getElementById('catTitleLabel').textContent  = c.titleLabel + ' *';
    document.getElementById('catTitle').placeholder       = c.titlePh;
    document.getElementById('catArtistLabel').textContent = c.artistLabel + ' *';
    document.getElementById('catArtist').placeholder      = c.artistPh;
    document.getElementById('catText').placeholder        = c.textPh;
    document.getElementById('catDate').valueAsDate        = new Date();
}

document.querySelector('.cat-logo').addEventListener('click', function() { goHome(); });

function openCatModal() {} // unused - login no longer required to view pages
function closeCatModal() { document.getElementById('catLoginModal').classList.remove('show'); }
function attemptLogin() {} // unused - write page no longer requires login

function doCatLogin() {
    if (document.getElementById('catPassword').value === 'pogchamp07') {
        catLoggedIn = true;
        localStorage.setItem('catLoggedIn', 'true');
        closeCatModal();
        document.getElementById('currentUserDisplay').textContent = 'Logged in as: angel';
        setCatFormLabels(currentCategory);
        document.getElementById('addReviewSection').classList.add('show');
    } else {
        document.getElementById('catLoginError').textContent = 'incorrect password';
    }
}

function doCatLogout() {
    catLoggedIn = false;
    localStorage.removeItem('catLoggedIn');
    document.getElementById('addReviewSection').classList.remove('show');
    loadCategoryReviews();
}

document.getElementById('catImage').addEventListener('input', function() {
    const p = document.getElementById('catImagePreview');
    p.src = this.value; p.style.display = this.value ? 'block' : 'none';
});

function submitCatReview() {
    const title  = document.getElementById('catTitle').value.trim();
    const artist = document.getElementById('catArtist').value.trim();
    const date   = document.getElementById('catDate').value;
    const image  = document.getElementById('catImage').value.trim();
    const text   = document.getElementById('catText').value.trim();
    if (!title)  { alert('Please fill in the title.'); return; }
    if (!artist) { alert('Please fill in the ' + (catConfig[currentCategory]?.artistLabel || 'artist') + ' field.'); return; }
    if (!date)   { alert('Please select a date.'); return; }
    if (!text)   { alert('Please write your review.'); return; }
    const pw = prompt('Enter password to post review:');
    if (pw === null) return;
    if (pw !== 'pogchamp07') { alert('Incorrect password.'); return; }
    const btn = document.getElementById('catSubmitBtn');
    btn.disabled = true; btn.textContent = 'POSTING...';
    try {
        const reviews = getReviews();
        reviews.unshift({ id: Date.now(), category: currentCategory, title, artist, date, image, text, created_at: new Date().toISOString() });
        saveReviews(reviews);
        clearCatForm();
        loadCategoryReviews();
    } catch(e) { alert('Error: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'POST REVIEW'; }
}

function clearCatForm() {
    ['catTitle','catArtist','catText','catImage'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('catImagePreview').style.display = 'none';
    document.getElementById('catDate').valueAsDate = new Date();
}

function loadCategoryReviews() {
    const container = document.getElementById('reviewsContainer');
    const data = getReviews().filter(r => r.category === currentCategory);
    if (data.length === 0) { container.innerHTML = '<div class="no-reviews">No reviews yet. Check back soon!</div>'; return; }
    container.innerHTML = '';
    data.forEach(review => {
        const el = document.createElement('div');
        el.className = 'review';
        el.innerHTML =
            '<div class="review-title">' + review.title + '</div>' +
            '<div class="review-meta">' + review.artist + ' &bull; ' + review.date + '</div>' +
            (review.image ? '<img src="' + review.image + '" alt="" class="review-image">' : '') +
            '<div class="review-text">' + review.text + '</div>' +
            '<button class="delete-btn" onclick="deleteReview(' + review.id + ')">Delete</button>';
        container.appendChild(el);
    });
}

function deleteReview(id) {
    const pw = prompt('Enter password to delete:');
    if (pw === null) return;
    if (pw !== 'pogchamp07') { alert('Incorrect password.'); return; }
    saveReviews(getReviews().filter(r => r.id !== id));
    loadCategoryReviews();
}

// ─── WRITE PAGE ───
const writeConfig = {
    music:     { titleLabel: 'ALBUM / SONG TITLE', titlePh: 'e.g., Midnights',          artistLabel: 'ARTIST',                   artistPh: 'e.g., Taylor Swift',      textPh: 'What did this album/song make you feel? Rate the tracks, the production, the lyrics...' },
    movies:    { titleLabel: 'MOVIE TITLE',         titlePh: 'e.g., Oppenheimer',         artistLabel: 'DIRECTOR',                 artistPh: 'e.g., Christopher Nolan', textPh: 'Was it worth watching? Talk about the story, acting, cinematography...' },
    wrestling: { titleLabel: 'EVENT / MATCH NAME',  titlePh: 'e.g., WrestleMania 39',    artistLabel: 'ORGANIZATION / PROMOTION', artistPh: 'e.g., WWE',               textPh: 'Break down the card, the crowd, the highlights and low points...' },
    fashion:   { titleLabel: 'BRAND / ITEM NAME',   titlePh: 'e.g., Oversized Blazer',   artistLabel: 'DESIGNER / STORE',         artistPh: 'e.g., ZARA',              textPh: "How does it fit? What's the quality like? Would you buy again?" },
    tech:      { titleLabel: 'PRODUCT / DEVICE',    titlePh: 'e.g., iPhone 15 Pro',      artistLabel: 'BRAND',                    artistPh: 'e.g., Apple',             textPh: 'Performance, design, value for money — give your honest take...' },
};

function doWriteLogout() {
    // no-op, kept for compatibility
}

function onWriteCategoryChange() {
    const cat = document.getElementById('writeCategorySelect').value;
    const block = document.getElementById('reviewFieldsBlock');
    if (!cat) { block.style.display = 'none'; return; }
    const c = writeConfig[cat];
    document.getElementById('wTitleLabel').textContent  = c.titleLabel;
    document.getElementById('wTitle').placeholder       = c.titlePh;
    document.getElementById('wArtistLabel').textContent = c.artistLabel;
    document.getElementById('wArtist').placeholder      = c.artistPh;
    document.getElementById('wText').placeholder        = c.textPh;
    clearWriteForm();
    block.style.display = 'block';
    document.getElementById('wDate').valueAsDate = new Date();
}

function clearWriteForm() {
    const cat = document.getElementById('writeCategorySelect').value;
    const block = document.getElementById('reviewFieldsBlock');
    if (!cat) { block.style.display = 'none'; return; }
    const c = writeConfig[cat];
    document.getElementById('wTitleLabel').textContent  = c.titleLabel;
    document.getElementById('wTitle').placeholder       = c.titlePh;
    document.getElementById('wArtistLabel').textContent = c.artistLabel;
    document.getElementById('wArtist').placeholder      = c.artistPh;
    document.getElementById('wText').placeholder        = c.textPh;
    clearWriteForm();
    block.style.display = 'block';
    document.getElementById('wDate').valueAsDate = new Date();
}

document.getElementById('wImage').addEventListener('input', function() {
    const p = document.getElementById('wImagePreview');
    p.src = this.value; p.style.display = this.value ? 'block' : 'none';
});

function submitWriteReview() {
    const cat    = document.getElementById('writeCategorySelect').value;
    const title  = document.getElementById('wTitle').value.trim();
    const artist = document.getElementById('wArtist').value.trim();
    const date   = document.getElementById('wDate').value;
    const image  = document.getElementById('wImage').value.trim();
    const text   = document.getElementById('wText').value.trim();
    if (!cat)    { alert('Please select a category.'); return; }
    if (!title)  { alert('Please fill in the title.'); return; }
    if (!artist) { alert('Please fill in the ' + (writeConfig[cat]?.artistLabel || 'artist') + ' field.'); return; }
    if (!date)   { alert('Please select a date.'); return; }
    if (!text)   { alert('Please write your review.'); return; }
    const pw = prompt('Enter password to post review:');
    if (pw === null) return;
    if (pw !== 'pogchamp07') { alert('Incorrect password.'); return; }
    const btn = document.getElementById('wSubmitBtn');
    btn.disabled = true; btn.textContent = 'Posting...';
    try {
        const reviews = getReviews();
        reviews.unshift({ id: Date.now(), category: cat, title, artist, date, image, text, created_at: new Date().toISOString() });
        saveReviews(reviews);
        clearWriteForm();
        document.getElementById('writeCategorySelect').value = '';
        document.getElementById('reviewFieldsBlock').style.display = 'none';
        document.getElementById('successBanner').classList.add('show');
        setTimeout(() => document.getElementById('successBanner').classList.remove('show'), 4000);
        loadManageReviews(currentManageFilter);
    } catch(e) { alert('Error: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'Post Review'; }
}

let currentManageFilter = 'all';

function loadManageReviews(filter) {
    currentManageFilter = filter || 'all';
    const list = document.getElementById('manageReviewsList');
    if (!list) return;
    let reviews = getReviews();
    if (currentManageFilter !== 'all') reviews = reviews.filter(r => r.category === currentManageFilter);
    if (reviews.length === 0) {
        list.innerHTML = '<div class="manage-no-reviews">// no reviews found</div>';
        return;
    }
    list.innerHTML = '';
    reviews.forEach(r => {
        const item = document.createElement('div');
        item.className = 'manage-review-item';
        const catLabel = { music:'MUSIC', movies:'MOVIES', wrestling:'PRO-WRESTLING', fashion:'FASHION', tech:'TECH' }[r.category] || r.category.toUpperCase();
        item.innerHTML =
            '<div class="manage-review-info">' +
                '<div class="manage-review-title">' + r.title + '</div>' +
                '<div class="manage-review-meta">' + r.artist + ' &bull; ' + catLabel + ' &bull; ' + r.date + '</div>' +
            '</div>' +
            '<button class="manage-delete-btn" onclick="deleteReviewFromWrite(' + r.id + ')">Delete</button>';
        list.appendChild(item);
    });
}

function filterManageReviews(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    loadManageReviews(filter);
}

function deleteReviewFromWrite(id) {
    const pw = prompt('Enter password to delete:');
    if (pw === null) return;
    if (pw !== 'pogchamp07') { alert('Incorrect password.'); return; }
    saveReviews(getReviews().filter(r => r.id !== id));
    loadManageReviews(currentManageFilter);
}

function clearWriteForm() {
    ['wTitle','wArtist','wText','wImage'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('wImagePreview').style.display = 'none';
    document.getElementById('successBanner').classList.remove('show');
    const d = document.getElementById('wDate'); if (d) d.valueAsDate = new Date();
}
// ─── HOME PAGE FILL SIZING ───
function sizeHomeToFill() {
    const vh = window.innerHeight;
    const vw = window.innerWidth;

    // Size by height: divide viewport into 6 rows
    const rowH = (vh * 0.94) / 6;
    const titleSizeByH = rowH * 0.62;
    const menuSizeByH  = rowH * 0.88;

    // Size by width: find widest item and scale so it fits within ~94vw
    // We use a hidden canvas to measure text width
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    function maxSizeByWidth(text, fontStyle, availableWidth) {
        let size = 200;
        ctx.font = `900 ${size}px ${fontStyle}`;
        const ratio = availableWidth / ctx.measureText(text).width;
        return size * ratio;
    }

    const avail = vw * 0.94;
    const titleMax = maxSizeByWidth('> angel\'s_brain', 'bold Courier New, monospace', avail);
    // PRO-WRESTLING is widest menu item
    const menuMax  = maxSizeByWidth('PRO-WRESTLING', '\'Helvetica Neue\', Helvetica, Arial, sans-serif', avail);

    const titleSize = Math.min(titleSizeByH, titleMax);
    const menuSize  = Math.min(menuSizeByH, menuMax);

    document.querySelector('.home-title').style.fontSize = titleSize + 'px';
    document.querySelectorAll('.menu-item').forEach(el => el.style.fontSize = menuSize + 'px');
}
sizeHomeToFill();
window.addEventListener('resize', sizeHomeToFill);
</script>
